# GymPabon backend configuration
server.port=8080
spring.application.name=gympabon-backend

# MySQL connection. Each developer sets their own user and password in
# application-local.properties (ignored by Git) or in the DB_USER / DB_PASSWORD
# environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/gympabon?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:classpath:application-local.properties

# JSON dates as text (2026-10-27) instead of numbers
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota
